services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-logto}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - logto-postgres-data:/var/lib/postgresql/data

  app:
    image: ${LOGTO_IMAGE:-ghcr.io/sdvico/logto}:${IMAGE_TAG:-develop}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >-
        npm run cli db seed -- --swe &&
        npm run cli db alt deploy ${ALTERATION_TARGET:-next} &&
        npm start
    ports:
      - "${CORE_PORT:-3001}:3001"
      - "${ADMIN_PORT:-3002}:3002"
    environment:
      TRUST_PROXY_HEADER: ${TRUST_PROXY_HEADER:-1}
      DB_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-logto}
      ENDPOINT: ${ENDPOINT:?ENDPOINT is required}
      ADMIN_ENDPOINT: ${ADMIN_ENDPOINT:?ADMIN_ENDPOINT is required}
      PRIVATE_KEY_ROTATION_GRACE_PERIOD: ${PRIVATE_KEY_ROTATION_GRACE_PERIOD:-0}
      SSRF_ALLOWED_ADDRESSES: ${SSRF_ALLOWED_ADDRESSES:-}
      SSRF_PROTECTION_DISABLED: ${SSRF_PROTECTION_DISABLED:-}
      OIDC_PROVIDER_SSRF_PROTECTION_DISABLED: ${OIDC_PROVIDER_SSRF_PROTECTION_DISABLED:-}

volumes:
  logto-postgres-data:
